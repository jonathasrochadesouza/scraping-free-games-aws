<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos Grátis - Descubra</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="title">Descubra<br><span class="title-main">Jogos grátis!</span></h1>
            <p class="subtitle">🚨 Jogue sem gastar um centavo e sem pirataria</p>
            
            <div class="game-list">
                <div class="game-item">Resident Evil 4</div>
                <div class="game-item">Batman</div>
                <div class="game-item">Spider Man</div>
            </div>
            
            <div class="form-container">
                <input type="email" class="email-input" placeholder="Email" id="emailInput">
                <button class="cta-button" onclick="discoverGames()">Descobrir Jogos Grátis</button>
            </div>
            
            <p class="footer-text">Jonathas Rocha De Souza</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
