<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos Grátis - Resultados</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="content results-page">
            <h1 class="title">Grátis agora, pela<br><span class="title-main">EPIC GAMES</span></h1>
            <p class="subtitle">Veja a lista abaixo</p>
            
            <div class="results-container">
            </div>
            
            <button class="back-button" onclick="goBack()">Voltar</button>
            <p class="footer-text">Jonathas Rocha De Souza</p>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const data = JSON.parse(localStorage.getItem('gamesData'));
            if (!data || !data.games) {
                alert('Nenhum dado de jogos encontrado. Tente novamente.');
                window.location.href = 'index.html';
                return;
            }

            const container = document.querySelector('.results-container');
            data.games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <img src="${game.thumbnail}" alt="${game.title}" class="game-image" loading="lazy">
                    <h3>${game.title}</h3>
                    <p class="game-description">${game.description}</p>
                    <p class="game-price">${game.discount_price} <span class="original-price">${game.original_price}</span></p>
                    <p class="game-dates">Até ${game.end_date_formatted}</p>
                `;
                card.addEventListener('click', () => window.open("https://store.epicgames.com/en-US/free-games"));
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
